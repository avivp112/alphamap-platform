# =============================================================================
# GitLab CI — manual deploy job for the Public Market Hub's Supabase Edge
# Functions (sync-public-markets, search-tickers, stock-profile, stock-history,
# sourcing-crawl, extract-job-signals, discover-boards, ingest-sec-form-d,
# ingest-uk-companies-house, ingest-uspto-patents, ingest-huggingface,
# ingest-github-velocity, ingest-epo-ops) plus their migrations.
#
# This pipeline does NOT run on ordinary pushes/merges — it only exists so you
# can trigger it by hand from the GitLab UI (Build -> Pipelines -> "Run
# pipeline"). Your normal git workflow is completely unaffected.
#
# ── One-time setup (do this in GitLab, never here in the repo) ──────────────
# Go to this project -> Settings -> CI/CD -> Variables -> Add variable, and add:
#
#   SUPABASE_ACCESS_TOKEN
#     A Supabase personal access token: https://supabase.com/dashboard/account/tokens
#     -> "Generate new token". Check "Mask variable" AND "Protect variable".
#
#   SUPABASE_PROJECT_REF
#     Your project's Reference ID: Supabase Dashboard -> Project Settings ->
#     General -> "Reference ID". Check "Mask variable" too (keeps it out of
#     job logs, even though it isn't itself a secret).
#
#   SUPABASE_DB_URL   (required by the migrate job only)
#     The full Postgres connection string: Supabase Dashboard -> Project
#     Settings -> Database -> Connection string -> URI. Check "Mask variable"
#     AND "Protect variable" — this grants full DDL access to your database.
#     The password must be percent-encoded if it contains URL-reserved
#     characters (@ : / ? # [ ] are the ones that bite).
#
# The FMP_API_KEY is a separate Supabase secret (set once via
# `supabase secrets set FMP_API_KEY=...`, see supabase/functions/sync-public-markets/README.md)
# — this pipeline never touches it.
#
# SEC_USER_AGENT is likewise a Supabase secret, not a CI variable, and
# ingest-sec-form-d refuses to run without it. SEC's access policy requires a
# User-Agent carrying a contact address and serves 403 to anything generic:
#
#   supabase secrets set SEC_USER_AGENT="AlphaMap sourcing you@yourdomain.com"
#
# The other two government ingesters need their own Supabase secrets and both
# refuse to run without them:
#
#   supabase secrets set COMPANIES_HOUSE_API_KEY="..."   # developer.company-information.service.gov.uk
#   supabase secrets set PATENTSVIEW_API_KEY="..."       # patentsview.org/apis/keyrequest
#   supabase secrets set GITHUB_TOKEN="ghp_..."          # classic token, NO scopes needed
#   supabase secrets set EPO_OPS_KEY="..." EPO_OPS_SECRET="..."   # developers.epo.org
#
# ingest-huggingface needs no secret at all — public listings are
# unauthenticated. HUGGINGFACE_TOKEN is optional and only raises rate limits.
#
# ── Job order ─────────────────────────────────────────────────────────────
# migrate-database runs FIRST and the function deploy depends on it, because a
# function that reads a new table must not go live before that table exists.
# If the migration fails the deploy is skipped rather than shipping code
# against a schema that was never applied.
#
# ── To deploy ─────────────────────────────────────────────────────────────
# GitLab -> Build -> Pipelines -> "Run pipeline" -> pick the branch -> Run.
# Watch the job log for each function's deploy confirmation.
# =============================================================================

stages:
  - build
  - migrate
  - deploy

# =============================================================================
# Build & typecheck — web (Vite/React) + mobile (Capacitor: Android, iOS)
#
# Unlike the migrate/deploy jobs below (which only run when you trigger them
# by hand from the GitLab UI), these run automatically on every ordinary
# pipeline — branch pushes and merge requests — no `rules:` gate needed. The
# whole point is to catch a broken build/typecheck before it lands. None of
# them deploy anything or touch a secret CI/CD variable.
# =============================================================================

# ── Web: typecheck + production build ───────────────────────────────────────
# Runs the exact two commands used to verify every change in this repo:
# a project-wide `tsc --noEmit` (see tsconfig.json — scoped to src/**, so it
# checks the shipped app without tripping over the Deno-runtime Supabase Edge
# Functions or the plain Node scripts, which use incompatible module/runtime
# assumptions and are verified separately, ad hoc) and the real `vite build`.
web-build:
  stage: build
  image: node:20
  script:
    - npm ci
    - npx tsc --noEmit
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# ── Android: sync the web build into the native project, compile a debug
# APK with Gradle ───────────────────────────────────────────────────────────
# Proves the native android/ project actually still builds — the thing most
# likely to silently break as the web app, capacitor.config.ts, or a
# Capacitor plugin changes — without needing an emulator (see
# capacitor.config.ts's comment: `npm run cap:build` is the same
# build + sync this job runs, just also compiled all the way to an APK).
android-build:
  stage: build
  image: mobiledevops/android-sdk-image:latest
  before_script:
    # mobiledevops/android-sdk-image ships Java + the Android SDK (with
    # ANDROID_HOME already configured) but no Node.js — install it so
    # npm/npx are available for the web build + `cap sync` steps below.
    # Must be Node >=22: the Capacitor 8 CLI refuses to run on Node 20
    # ("The Capacitor CLI requires NodeJS >=22.0.0") and fails `cap sync`
    # right after the web build succeeds — web-build's `node:20` image is
    # fine for that job (it never touches the Capacitor CLI), but this job
    # does, so it needs the newer runtime.
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y -qq --no-install-recommends nodejs
    - node --version && npm --version
  script:
    - npm ci
    - npm run build
    - npx cap sync android
    - cd android
    - chmod +x ./gradlew
    - ./gradlew assembleDebug --no-daemon
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/*.apk
    expire_in: 1 week

# ── iOS: TEMPLATE — inert until a macOS runner is attached ─────────────────
# GitLab.com's default shared runners are Linux-only; building an iOS app
# needs Xcode, which only runs on macOS. This job is real config (not just
# YAML comments) so it's ready to go, but it can never run — and so can
# never hang or fail a pipeline — until BOTH of these are true:
#
#   1. A macOS runner (self-hosted, or a GitLab SaaS macOS runner on a plan
#      that includes them) is registered to this project with the tag
#      "macos" — Settings -> CI/CD -> Runners -> "New project runner".
#   2. That runner's image has Xcode + the iOS platform + CocoaPods
#      installed (`sudo gem install cocoapods` if it's missing).
#
# Even once both are true it stays `when: manual` on purpose — an iOS build
# isn't something you want firing automatically on every push against a
# macOS runner's (often paid/limited) minutes; trigger it by hand from the
# pipeline's job list when you actually want one.
ios-build:
  stage: build
  tags:
    - macos
  when: manual
  allow_failure: true
  before_script:
    - npm ci
    - npm run build
    - npx cap sync ios
    - cd ios/App
    - pod install --repo-update
  script:
    # -sdk iphonesimulator + CODE_SIGNING_ALLOWED=NO builds without any
    # signing identity/provisioning profile — enough to prove the native
    # project compiles and to hand the resulting .app to a Simulator for a
    # real visual test. A device/App Store build additionally needs a
    # signing certificate + provisioning profile configured on the runner
    # (requires an Apple Developer Program membership) — out of scope for
    # this template; fill that in once you're ready to distribute a build.
    - >
      xcodebuild
      -workspace App.xcworkspace
      -scheme App
      -sdk iphonesimulator
      -configuration Debug
      -derivedDataPath build
      CODE_SIGNING_ALLOWED=NO
      build
  artifacts:
    paths:
      - ios/App/build/Build/Products/Debug-iphonesimulator/*.app
    expire_in: 1 week

# ── Database migrations ─────────────────────────────────────────────────────
# `supabase db push` records what it applied in supabase_migrations.schema_
# migrations on the remote, so re-running the pipeline replays only genuinely
# new files — unlike piping every .sql through psql, which would re-execute
# the lot each time.
migrate-database:
  stage: migrate
  image: node:20-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
    - npm install -g supabase
    - supabase --version
    - export SUPABASE_DB_URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '[:space:]')
  script:
    # ── Opt-in ──────────────────────────────────────────────────────────────
    # Until SUPABASE_DB_URL is configured this job no-ops instead of failing,
    # so adding it to the pipeline cannot break the function deploy that was
    # already working.
    - |
      if [ -z "$SUPABASE_DB_URL" ]; then
        echo "SUPABASE_DB_URL is not set — SKIPPING migrations."
        echo "To enable: Settings -> CI/CD -> Variables -> add SUPABASE_DB_URL"
        echo "(masked + protected), from Project Settings -> Database ->"
        echo "Connection string -> URI. Percent-encode the password if it"
        echo "contains @ : / ? # [ or ]."
        exit 0
      fi

    # ── Baseline guard ──────────────────────────────────────────────────────
    # These migrations predate this pipeline and were applied by hand, and
    # four of them use bare CREATE TABLE. If the remote has no migration
    # history, `db push` would treat all of them as pending and abort on
    # "relation already exists". Detect that and stop with instructions rather
    # than firing 30+ historical migrations at a live database.
    - |
      set -e
      APPLIED=$(psql "$SUPABASE_DB_URL" -tAc "
        SELECT count(*) FROM information_schema.tables
         WHERE table_schema='supabase_migrations' AND table_name='schema_migrations';
      ")
      if [ "$APPLIED" = "0" ]; then
        HAS_DATA=$(psql "$SUPABASE_DB_URL" -tAc "
          SELECT count(*) FROM information_schema.tables
           WHERE table_schema='public' AND table_name='startups';
        ")
        if [ "$HAS_DATA" != "0" ]; then
          echo "ERROR: this database has application tables but no migration history."
          echo "Pushing now would replay every historical migration and fail on"
          echo "the un-guarded CREATE TABLEs. Baseline it once, then re-run:"
          echo ""
          echo "  psql \"\$SUPABASE_DB_URL\" -f supabase/scripts/baseline_migration_history.sql"
          echo ""
          echo "That marks the already-applied files as applied without re-running them."
          exit 1
        fi
      fi

    # Print the plan before acting on it, so the log shows the intent even if
    # the apply then fails.
    - supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
    - supabase db push --db-url "$SUPABASE_DB_URL" --yes

    # `db push` exits 0 on an empty migration set, which is indistinguishable
    # from a real apply — so assert the end state instead of trusting the code.
    - |
      set -e
      TABLES=$(psql "$SUPABASE_DB_URL" -tAc "
        SELECT string_agg(tablename, ',' ORDER BY tablename)
          FROM pg_tables
         WHERE schemaname='public'
           AND tablename IN ('sourcing_companies','early_job_postings','job_signals');
      ")
      echo "sourcing tables present: $TABLES"
      if [ "$TABLES" != "early_job_postings,job_signals,sourcing_companies" ]; then
        echo "Sourcing tables missing after push — migration did not apply cleanly."
        exit 1
      fi
      COLS=$(psql "$SUPABASE_DB_URL" -tAc "
        SELECT count(*) FROM information_schema.columns
         WHERE table_name='sourcing_companies' AND column_name='last_crawled_at';
      ")
      if [ "$COLS" != "1" ]; then
        echo "sourcing_companies.last_crawled_at missing — crawler scheduling would break."
        exit 1
      fi
      echo "Schema verified."

    # ── Scoring regression tests ────────────────────────────────────────────
    # Runs AFTER the migrations, so it tests the schema that was just applied.
    # migrate-database is a `needs:` of the deploy job, so a failure here blocks
    # the deploy — which is the point. A wrong scoring view does not crash
    # anything; it silently ranks the wrong companies, and shipping functions
    # on top of that makes it harder to notice, not easier.
    #
    # The script is transactional (BEGIN ... ROLLBACK) and leaves no rows.
    - |
      echo "Running supabase/tests/fomo_scoring.test.sql"

      # NOT `set -e` around the capture. Under set -e a failing psql aborts the
      # assignment before the output is ever echoed, so a connection error or a
      # syntax error produces a red pipeline with NO diagnostic — the single
      # most annoying way for CI to fail. Capture status separately and print
      # the output either way.
      OUT=$(psql "$SUPABASE_DB_URL" -f supabase/tests/fomo_scoring.test.sql 2>&1) && RC=0 || RC=$?
      echo "$OUT"
      if [ "$RC" != "0" ]; then
        echo "psql exited $RC — the test could not run (see output above)."
        exit 1
      fi

      # psql exits 0 even when an assertion prints FAIL: the script reports
      # through RAISE NOTICE, which is not an error condition as far as the
      # client is concerned. So the text has to be checked.
      FAILED=$(printf '%s' "$OUT" | grep -c 'FAIL  ' || true)
      PASSED=$(printf '%s' "$OUT" | grep -c 'PASS  ' || true)
      echo "fomo_scoring: $PASSED passed, $FAILED failed"

      if [ "$FAILED" != "0" ]; then
        echo "Scoring assertions FAILED. The leaderboard would rank companies"
        echo "incorrectly and nothing would error at runtime. Blocking the deploy."
        exit 1
      fi

      # Zero failures is not the same as having run. An empty output would also
      # report zero failures, so assert the assertion COUNT as well — this is
      # the guard against the test silently not executing.
      if [ "$PASSED" -lt 24 ]; then
        echo "Expected at least 24 assertions, saw $PASSED."
        echo "The test did not run to completion — treating that as a failure."
        exit 1
      fi
      echo "Scoring verified."

    # ── Entity resolution tests ─────────────────────────────────────────────
    # merge_companies() deletes rows and rewrites foreign keys. The gap-fill
    # contract — enrichment is never overwritten — is invisible in review and
    # only observable by running it. Same failure handling as above.
    - |
      echo "Running supabase/tests/entity_resolution.test.sql"
      OUT=$(psql "$SUPABASE_DB_URL" -f supabase/tests/entity_resolution.test.sql 2>&1) && RC=0 || RC=$?
      echo "$OUT"
      if [ "$RC" != "0" ]; then
        echo "psql exited $RC — the test could not run (see output above)."
        exit 1
      fi
      FAILED=$(printf '%s' "$OUT" | grep -c 'FAIL  ' || true)
      PASSED=$(printf '%s' "$OUT" | grep -c 'PASS  ' || true)
      echo "entity_resolution: $PASSED passed, $FAILED failed"
      if [ "$FAILED" != "0" ]; then
        echo "Merge/resolution assertions FAILED. A bad merge silently destroys"
        echo "enriched data and is not recoverable from the audit alone."
        exit 1
      fi
      if [ "$PASSED" -lt 55 ]; then
        echo "Expected at least 55 assertions, saw $PASSED — the test did not run fully."
        exit 1
      fi
      echo "Entity resolution verified."

    # ── Entity resolver tests ───────────────────────────────────────────────
    # The resolvers decide WHICH rows are the same company, and tier 1 merges
    # without asking anyone. A false positive there is invisible and
    # self-reinforcing, so this runs on every deployment like the rest.
    #
    # NOTE the different grep: this test reports as a RESULT TABLE, not through
    # RAISE NOTICE, so the 'PASS  ' pattern used above matches nothing here.
    # Anchoring to '^ PASS' matches psql's aligned output.
    - |
      echo "Running supabase/tests/entity_resolvers.test.sql"
      OUT=$(psql "$SUPABASE_DB_URL" -f supabase/tests/entity_resolvers.test.sql 2>&1) && RC=0 || RC=$?
      echo "$OUT"
      if [ "$RC" != "0" ]; then
        echo "psql exited $RC — the test could not run (see output above)."
        exit 1
      fi
      FAILED=$(printf '%s' "$OUT" | grep -cE '^ FAIL' || true)
      PASSED=$(printf '%s' "$OUT" | grep -cE '^ PASS' || true)
      echo "entity_resolvers: $PASSED passed, $FAILED failed"
      if [ "$FAILED" != "0" ]; then
        echo "Resolver assertions FAILED. A wrong auto-merge is not visible in"
        echo "the product and cannot be undone from the audit alone."
        exit 1
      fi
      if [ "$PASSED" -lt 41 ]; then
        echo "Expected at least 41 assertions, saw $PASSED — the test did not run fully."
        exit 1
      fi
      echo "Entity resolvers verified."

deploy-public-market-functions:
  stage: deploy
  # Never ship functions against a schema that failed to migrate.
  needs: ["migrate-database"]
  image: node:20-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - npm install -g supabase
    - supabase --version
    # Defensively strip whitespace/newlines a copy-paste into the GitLab
    # variable UI can silently introduce.
    - export SUPABASE_ACCESS_TOKEN=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
    - export SUPABASE_PROJECT_REF=$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '[:space:]')
    # Definitive, secret-safe shape check — never prints the token itself,
    # only whether it matches Supabase's documented sbp_<40 lowercase-hex>
    # format. A prior run showed a 47-char token starting "sbp_v0" (44 chars
    # and pure hex expected) — this confirms whether that's really the shape
    # reaching the job, rather than guessing from a 6-char prefix.
    - |
      if printf '%s' "$SUPABASE_ACCESS_TOKEN" | grep -Eq '^sbp_[0-9a-f]{40}$'; then
        echo "Token shape check: MATCHES sbp_<40 hex> (looks like a valid personal access token)"
      else
        echo "Token shape check: DOES NOT MATCH sbp_<40 hex> — length $(printf '%s' "$SUPABASE_ACCESS_TOKEN" | wc -c) chars. This token is not in the expected format; regenerate it fresh from https://supabase.com/dashboard/account/tokens and re-paste into a NEW (deleted+recreated) GitLab variable rather than editing the existing one."
      fi
  script:
    # supabase link's token-format check has been reported to reject some
    # otherwise-working tokens; skip link entirely and pass --project-ref
    # straight to each deploy call instead (link isn't required for
    # deploying — this is also the pattern Supabase's own CI/CD docs use).
    #
    # deploy_fn retries: the CLI has been observed to complete a deploy
    # successfully ("Deployed Functions...") and then still exit non-zero
    # because its own telemetry shutdown ("Timeout while shutting down
    # PostHog") times out — which otherwise aborts the whole job before
    # later functions get deployed. Deploys are idempotent, so retrying is
    # always safe.
    - |
      deploy_fn() {
        local name="$1"
        for attempt in 1 2 3; do
          if supabase functions deploy "$name" --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"; then
            return 0
          fi
          echo "deploy of $name failed (attempt $attempt/3) — retrying in 5s..."
          sleep 5
        done
        echo "deploy of $name failed after 3 attempts"
        return 1
      }
    - deploy_fn sync-public-markets
    - deploy_fn search-tickers
    - deploy_fn stock-profile
    - deploy_fn stock-history
    - deploy_fn sourcing-crawl
    - deploy_fn extract-job-signals
    - deploy_fn discover-boards
    - deploy_fn ingest-sec-form-d
    - deploy_fn ingest-uk-companies-house
    - deploy_fn ingest-uspto-patents
    - deploy_fn ingest-huggingface
    - deploy_fn ingest-github-velocity
    - deploy_fn ingest-epo-ops
    - deploy_fn ingest-startup

# ── Embedding backfill ────────────────────────────────────────────────────────
# Runs on a SCHEDULE, never on the manual deploy pipeline. Two reasons: it costs
# real OpenAI money per row, and it walks the whole corpus — attaching that to
# every deploy would make shipping a code change slow and expensive for no
# reason.
#
# Set up once: GitLab -> Build -> Pipeline schedules -> New schedule, daily,
# with a variable SCHEDULED_TASK = embeddings.
#
# Needs OPENAI_API_KEY, SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as masked
# CI/CD variables (the script reads them from the environment).
#
# The script is incremental by design: rows are ordered embedding_updated_at
# NULLS FIRST so never-embedded rows go first, and each row's source text is
# hashed so unchanged rows are skipped without an API call. Re-running is cheap;
# missing a day is harmless.
#
# This exists because backfill_embeddings.ts was written, committed, and never
# wired to anything — so `startups.embedding` was only as current as the last
# time somebody ran it by hand. The semantic tier of entity resolution has no
# input without it.
backfill-embeddings:
  stage: migrate
  image: node:20-slim
  rules:
    - if: '$SCHEDULED_TASK == "embeddings"'
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund || npm install
  script:
    - |
      for v in OPENAI_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
        eval "val=\$$v"
        if [ -z "$val" ]; then
          echo "$v is not set — cannot embed. Add it under Settings -> CI/CD -> Variables (masked)."
          exit 1
        fi
      done
    # DRY_RUN defaults to true in the script, which is the right default for a
    # human running it by hand and the wrong one for a scheduled job.
    - DRY_RUN=false TABLE=both npx tsx scripts/backfill_embeddings.ts
    - |
      echo "Embedding coverage after the run:"
      apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
      if [ -n "$SUPABASE_DB_URL" ]; then
        psql "$SUPABASE_DB_URL" -c "
          SELECT 'startups' AS t, count(*) AS rows, count(embedding) AS embedded,
                 round(100.0 * count(embedding) / nullif(count(*),0), 1) AS pct
            FROM startups
          UNION ALL
          SELECT 'investors', count(*), count(embedding),
                 round(100.0 * count(embedding) / nullif(count(*),0), 1)
            FROM investors;"
      fi
