name: Sync Missing Funding Rows

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, no DB writes)"
        type: boolean
        default: true

jobs:
  sync:
    name: Sync Missing Funding Rows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run sync script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: npx tsx scripts/sync_missing_funding_rows.ts
