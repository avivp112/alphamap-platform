name: VC Ingestion Pipeline

# Scheduled: every Monday at 02:00 UTC
#   (staggered 2 h after Sunday's weekly-market-intel run to avoid DB contention)
# Manual:    workflow_dispatch with dry_run + optional single-adapter filter

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — report only, no DB writes (always try this first)"
        type: boolean
        default: true
      source:
        description: "Run a single adapter: vcdirectory | wikipedia (blank = all)"
        type: string
        default: ""

jobs:
  ingest:
    name: "VC Ingestion — dry=${{ github.event.inputs.dry_run || 'false' }} source=${{ github.event.inputs.source || 'all' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Show run parameters
        run: |
          echo "════════════════════════════════════════"
          echo "  Trigger  = ${{ github.event_name }}"
          echo "  DRY_RUN  = ${{ github.event.inputs.dry_run  || 'false' }}"
          echo "  SOURCE   = ${{ github.event.inputs.source   || 'all' }}"
          echo "  SUPABASE_URL set = ${{ secrets.SUPABASE_URL != '' }}"
          echo "════════════════════════════════════════"

      - name: Run VC ingestion
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Scheduled runs default to live write (false); manual dispatch respects the checkbox.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SOURCE:  ${{ github.event.inputs.source  || '' }}
        run: npx tsx scripts/agent_vcs_scraper.ts
