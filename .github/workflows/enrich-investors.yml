name: Enrich Investor Profiles

# Manual trigger — fills missing profile data (AUM, description, thesis, HQ,
# leadership with LinkedIn URLs) for VC and PE firms in the `investors` table.
#
# Same self-advancing queue as Bulk Enrich All Startups: every processed firm
# is stamped with last_enriched_at, so re-run with the SAME settings (keep
# OFFSET=0) until the queue is empty — no OFFSET arithmetic needed.
#
# Search: Serper (3 queries/firm) + direct fetch of the firm's own website
# (homepage + team page) — the site fetch is free and is the highest-trust
# source for thesis/description/leadership.
#
# Requires secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY, SERP_KEY

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — no DB writes (always try this first)"
        type: boolean
        default: true
      batch_size:
        description: "Firms to process this run"
        type: number
        default: 100
      offset:
        description: "Normally leave at 0 — the queue advances automatically via last_enriched_at."
        type: number
        default: 0
      delay_ms:
        description: "Milliseconds to wait between firms (default: 8000)"
        type: number
        default: 8000
      min_confidence:
        description: "Minimum confidence to write dollar figures (AUM, check size). Descriptive fields always write."
        type: number
        default: 40
      model:
        description: "Claude model for extraction"
        type: choice
        default: "claude-haiku-4-5-20251001"
        options:
          - "claude-haiku-4-5-20251001"
          - "claude-sonnet-5"

jobs:
  enrich-investors:
    name: "Investors — offset=${{ github.event.inputs.offset }} batch=${{ github.event.inputs.batch_size }} dry=${{ github.event.inputs.dry_run }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Show run parameters
        run: |
          echo "════════════════════════════════════════"
          echo "  DRY_RUN        = ${{ github.event.inputs.dry_run }}"
          echo "  BATCH_SIZE     = ${{ github.event.inputs.batch_size }}"
          echo "  OFFSET         = ${{ github.event.inputs.offset }}"
          echo "  DELAY_MS       = ${{ github.event.inputs.delay_ms }}"
          echo "  MIN_CONFIDENCE = ${{ github.event.inputs.min_confidence }}"
          echo "  MODEL          = ${{ github.event.inputs.model }}"
          echo "  SERP_KEY set   = ${{ secrets.SERP_KEY != '' }}"
          echo "════════════════════════════════════════"

      - name: Run investor enrichment
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          SERP_KEY:                  ${{ secrets.SERP_KEY }}
          DRY_RUN:                   ${{ github.event.inputs.dry_run }}
          BATCH_SIZE:                ${{ github.event.inputs.batch_size }}
          OFFSET:                    ${{ github.event.inputs.offset }}
          DELAY_MS:                  ${{ github.event.inputs.delay_ms }}
          MIN_CONFIDENCE:            ${{ github.event.inputs.min_confidence }}
          ENRICH_MODEL:              ${{ github.event.inputs.model }}
        run: npx tsx scripts/enrich_investors.ts
