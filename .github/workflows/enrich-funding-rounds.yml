name: Enrich Funding Rounds

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, no DB writes)"
        type: boolean
        default: true
      batch_size:
        description: "Max companies to enrich in one run (default: 50)"
        type: number
        default: 50
      target_company:
        description: "Enrich a single company by exact name (e.g. 'Supabase'). Leave blank to process all eligible."
        type: string
        required: false
        default: ""

jobs:
  enrich:
    name: Enrich Funding Rounds
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run enrichment script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          TARGET_COMPANY: ${{ github.event.inputs.target_company }}
        run: npx tsx scripts/enrich_funding_rounds.ts
