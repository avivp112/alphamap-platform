name: Bulk Enrich All Startups

# Manual trigger only — this is a long-running, resource-intensive job.
# Run in batches of 300 to stay within the 360-minute GHA limit.
#
# Recommended execution plan for a large unenriched database:
#   Dry run first:  MAX_TIER=2 BATCH_SIZE=300 dry_run=true
#   Then repeat:    MAX_TIER=2 BATCH_SIZE=300 dry_run=false  (keep OFFSET=0)
#   Every processed company is stamped with last_enriched_at and moves behind
#   the untouched ones, so identical re-runs walk the whole database batch by
#   batch — no OFFSET arithmetic needed.
#
# Search engine: Tavily (primary, budget-controlled) → Serper/Google (fallback), 5 searches/company
# Requires secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY,
#                   TAVILY_API_KEY (optional), SERP_KEY
#
# Note: rows the model identifies as publicly traded are DELETED outright (not just
# skipped) — this tool only tracks private companies. Manually-verified rows are never
# deleted even if flagged public.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — no DB writes (always try this first)"
        type: boolean
        default: true
      batch_size:
        description: "Companies to process this run (recommended: 300)"
        type: number
        default: 300
      offset:
        description: "Normally leave at 0 — the queue advances automatically via last_enriched_at. Only for resuming a cancelled run."
        type: number
        default: 0
      max_tier:
        description: "Max tier to process: 2 = skip complete companies (Tier 3), 3 = all"
        type: number
        default: 2
      tavily_budget:
        description: "Max Tavily API calls this run (5 per company; 0 to use Serper only)"
        type: number
        default: 0
      delay_ms:
        description: "Milliseconds to wait between companies (default: 15000)"
        type: number
        default: 15000
      min_confidence:
        description: "Minimum confidence to write funding rounds (default: 40). Profile fields (description, founders, etc.) always write regardless — this only gates dollar figures."
        type: number
        default: 40
      model:
        description: "Claude model for extraction (Haiku 4.5 is the cost-efficient default; Sonnet 5 costs ~2-4x more)"
        type: choice
        default: "claude-haiku-4-5-20251001"
        options:
          - "claude-haiku-4-5-20251001"
          - "claude-sonnet-5"

jobs:
  bulk-enrich:
    name: "Enrich — tier≤${{ github.event.inputs.max_tier }} offset=${{ github.event.inputs.offset }} batch=${{ github.event.inputs.batch_size }} dry=${{ github.event.inputs.dry_run }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Show run parameters
        run: |
          echo "════════════════════════════════════════"
          echo "  DRY_RUN        = ${{ github.event.inputs.dry_run }}"
          echo "  BATCH_SIZE     = ${{ github.event.inputs.batch_size }}"
          echo "  OFFSET         = ${{ github.event.inputs.offset }}"
          echo "  MAX_TIER       = ${{ github.event.inputs.max_tier }}"
          echo "  TAVILY_BUDGET  = ${{ github.event.inputs.tavily_budget }}"
          echo "  DELAY_MS       = ${{ github.event.inputs.delay_ms }}"
          echo "  MIN_CONFIDENCE = ${{ github.event.inputs.min_confidence }}"
          echo "  MODEL          = ${{ github.event.inputs.model }}"
          echo "  SERP_KEY set   = ${{ secrets.SERP_KEY != '' }}"
          echo "════════════════════════════════════════"

      - name: Run bulk enrichment
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY:            ${{ secrets.TAVILY_API_KEY }}
          SERP_KEY:                  ${{ secrets.SERP_KEY }}
          DRY_RUN:                   ${{ github.event.inputs.dry_run }}
          BATCH_SIZE:                ${{ github.event.inputs.batch_size }}
          OFFSET:                    ${{ github.event.inputs.offset }}
          MAX_TIER:                  ${{ github.event.inputs.max_tier }}
          TAVILY_BUDGET:             ${{ github.event.inputs.tavily_budget }}
          DELAY_MS:                  ${{ github.event.inputs.delay_ms }}
          MIN_CONFIDENCE:            ${{ github.event.inputs.min_confidence }}
          ENRICH_MODEL:              ${{ github.event.inputs.model }}
        run: npx tsx scripts/bulk_enrich_all.ts
